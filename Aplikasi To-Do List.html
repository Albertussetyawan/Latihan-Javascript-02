<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
</head>
<body>

    <h2>To-Do List</h2>

    <input type="text" id="tugas" placeholder="Tulis tugas...">
    <button onclick="tambahTugas()">Tambah</button>

    <ul id="daftarTugas">
    </ul>

    <script>
        // Fungsi untuk menambahkan tugas
        function tambahTugas() {

            // Mengambil input tugas
            let tugas = document.getElementById("tugas").value;

            // Memeriksa apakah input kosong
            if (tugas.trim() === "") {
                alert("Silakan masukkan tugas terlebih dahulu!");
                return;
            }

            // Membuat elemen daftar baru
            let itemBaru = document.createElement("li");

            // Memasukkan teks tugas ke dalam daftar
            itemBaru.textContent = tugas;

            // Menampilkan tugas pada daftar
            document.getElementById("daftarTugas")
                    .appendChild(itemBaru);

            // Mengosongkan kolom input
            document.getElementById("tugas").value = "";
        }
    </script>

</body>
</html>
